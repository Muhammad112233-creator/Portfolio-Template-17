<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" width="1280" height="430" role="img" aria-label="RayanOS — an interactive desktop operating system portfolio built with React 19, TypeScript, Vite and Zustand">
  <defs>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ff5f6d"/>
      <stop offset="14%"  stop-color="#ff9a44"/>
      <stop offset="28%"  stop-color="#f7d038"/>
      <stop offset="42%"  stop-color="#6ee7a8"/>
      <stop offset="56%"  stop-color="#3ec6ff"/>
      <stop offset="70%"  stop-color="#8b7cff"/>
      <stop offset="84%"  stop-color="#ff6fd8"/>
      <stop offset="100%" stop-color="#ff5f6d"/>
      <animate attributeName="gradientTransform" values="translate(-0.45 0);translate(0.45 0);translate(-0.45 0)" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#1a2035"/>
      <stop offset="100%" stop-color="#0a0d16"/>
    </linearGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8fc0ff"/>
      <stop offset="55%" stop-color="#5c83ff"/>
      <stop offset="100%" stop-color="#8d6bff"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#5c83ff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#5c83ff" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="typeClip">
      <rect x="0" y="0" width="0" height="60">
        <animate attributeName="width" values="0;640" dur="2.6s" begin="0.9s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="1280" height="430" rx="22" fill="url(#panel)"/>
  <rect x="0.5" y="0.5" width="1279" height="429" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>

  <!-- ambient glows -->
  <circle cx="250" cy="80" r="230" fill="url(#glow)">
    <animate attributeName="cx" values="250;300;250" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="360" r="260" fill="url(#glow)" opacity="0.7">
    <animate attributeName="cx" values="1050;990;1050" dur="13s" repeatCount="indefinite"/>
  </circle>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.035">
    <path d="M0 86h1280M0 172h1280M0 258h1280M0 344h1280"/>
  </g>

  <!-- ============ left: wordmark ============ -->
  <g transform="translate(74 96)">
    <text x="0" y="0" font-family="'Segoe UI', -apple-system, Inter, Helvetica, Arial, sans-serif"
          font-size="76" font-weight="700" letter-spacing="-1.5" fill="url(#rainbow)">RayanOS</text>

    <!-- typed subtitle -->
    <g clip-path="url(#typeClip)">
      <text x="2" y="52" font-family="'Segoe UI', -apple-system, Inter, Helvetica, Arial, sans-serif"
            font-size="21" fill="#9aa6c4" letter-spacing="0.2">Product Engineer · Interface Designer · Lahore, PK</text>
    </g>
    <rect x="612" y="32" width="10" height="24" rx="2" fill="url(#accent)">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite" begin="3.5s"/>
      <animate attributeName="x" values="2;612" dur="2.6s" begin="0.9s" fill="freeze"/>
    </rect>

    <!-- tag pills -->
    <g font-family="'Segoe UI', -apple-system, Inter, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600">
      <rect x="0"  y="82" width="128" height="32" rx="16" fill="url(#accent)" opacity="0.16" stroke="url(#accent)" stroke-opacity="0.45">
        <animate attributeName="opacity" values="0.16;0.3;0.16" dur="4.4s" repeatCount="indefinite"/>
      </rect>
      <text x="20" y="103" fill="#a9c4ff">React 19</text>

      <rect x="140" y="82" width="150" height="32" rx="16" fill="url(#accent)" opacity="0.16" stroke="url(#accent)" stroke-opacity="0.45">
        <animate attributeName="opacity" values="0.3;0.16;0.3" dur="4.4s" repeatCount="indefinite"/>
      </rect>
      <text x="160" y="103" fill="#a9c4ff">TypeScript</text>

      <rect x="302" y="82" width="86" height="32" rx="16" fill="url(#accent)" opacity="0.16" stroke="url(#accent)" stroke-opacity="0.45"/>
      <text x="322" y="103" fill="#a9c4ff">Vite 6</text>

      <rect x="400" y="82" width="118" height="32" rx="16" fill="url(#accent)" opacity="0.16" stroke="url(#accent)" stroke-opacity="0.45"/>
      <text x="420" y="103" fill="#a9c4ff">Zustand</text>
    </g>

    <text x="2" y="152" font-family="'Segoe UI', -apple-system, Inter, Helvetica, Arial, sans-serif"
          font-size="14.5" fill="#6b7796">Boot screen → lock screen → a desktop with draggable windows, a real taskbar and a start menu.</text>
  </g>

  <!-- ============ right: mini desktop ============ -->
  <g transform="translate(742 74)">
    <!-- monitor frame -->
    <rect x="0" y="0" width="470" height="286" rx="14" fill="#0c1019" stroke="#ffffff" stroke-opacity="0.1"/>

    <!-- wallpaper -->
    <clipPath id="screen">
      <rect x="8" y="8" width="454" height="270" rx="9"/>
    </clipPath>
    <g clip-path="url(#screen)">
      <rect x="8" y="8" width="454" height="270" fill="#101a33"/>
      <ellipse cx="120" cy="70" rx="220" ry="150" fill="#2a4a8f" opacity="0.55"/>
      <ellipse cx="400" cy="250" rx="200" ry="140" fill="#5c3f8f" opacity="0.42"/>
      <ellipse cx="240" cy="300" rx="260" ry="120" fill="#0d3a52" opacity="0.5"/>

      <!-- floating window -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 6; 0 -6; 0 6" dur="6.4s" repeatCount="indefinite"/>
        <rect x="104" y="52" width="252" height="164" rx="10" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.16"/>
        <rect x="104" y="52" width="252" height="26" rx="10" fill="#ffffff" fill-opacity="0.09"/>
        <rect x="104" y="70" width="252" height="8" fill="#ffffff" fill-opacity="0.09"/>
        <circle cx="118" cy="65" r="4.6" fill="#8fc0ff" opacity="0.95"/>
        <rect x="130" y="61.5" width="66" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.36"/>
        <circle cx="340" cy="65" r="4" fill="#ffffff" fill-opacity="0.22"/>
        <circle cx="328" cy="65" r="4" fill="#ffffff" fill-opacity="0.22"/>
        <circle cx="316" cy="65" r="4" fill="#ffffff" fill-opacity="0.22"/>

        <!-- content lines -->
        <rect x="118" y="92"  width="222" height="9"  rx="4.5" fill="#ffffff" fill-opacity="0.28"/>
        <rect x="118" y="108" width="176" height="9"  rx="4.5" fill="#ffffff" fill-opacity="0.18"/>
        <rect x="118" y="124" width="204" height="9"  rx="4.5" fill="#ffffff" fill-opacity="0.13"/>

        <!-- tile row -->
        <rect x="118" y="146" width="66" height="52" rx="7" fill="#5c83ff" fill-opacity="0.5"/>
        <rect x="194" y="146" width="66" height="52" rx="7" fill="#12a5a5" fill-opacity="0.45"/>
        <rect x="270" y="146" width="66" height="52" rx="7" fill="#a35bd4" fill-opacity="0.45"/>
      </g>

      <!-- desktop icons, left column -->
      <g fill="#ffffff" fill-opacity="0.62">
        <rect x="22" y="26" width="22" height="22" rx="6" fill="#e0a63a" opacity="0.85"/>
        <rect x="24" y="52" width="18" height="4" rx="2"/>
        <rect x="22" y="74" width="22" height="22" rx="6" fill="#5c83ff" opacity="0.85"/>
        <rect x="24" y="100" width="18" height="4" rx="2"/>
        <rect x="22" y="122" width="22" height="22" rx="6" fill="#12a5a5" opacity="0.85"/>
        <rect x="24" y="148" width="18" height="4" rx="2"/>
      </g>

      <!-- taskbar -->
      <rect x="8" y="240" width="454" height="38" fill="#0b1220" fill-opacity="0.72"/>
      <rect x="8" y="240" width="454" height="1" fill="#ffffff" fill-opacity="0.12"/>
      <g>
        <rect x="196" y="250" width="18" height="18" rx="5" fill="url(#accent)"/>
        <circle cx="232" cy="259" r="8" fill="#ffffff" fill-opacity="0.55"/>
        <circle cx="256" cy="259" r="8" fill="#ffffff" fill-opacity="0.32"/>
        <rect x="276" y="251" width="16" height="16" rx="5" fill="#ffffff" fill-opacity="0.3"/>
        <rect x="300" y="251" width="16" height="16" rx="5" fill="#ffffff" fill-opacity="0.3"/>
        <rect x="196" y="272" width="18" height="3" rx="1.5" fill="#8fc0ff">
          <animate attributeName="width" values="18;26;18" dur="3.2s" repeatCount="indefinite"/>
        </rect>
        <circle cx="232" cy="273.5" r="1.6" fill="#ffffff" fill-opacity="0.5"/>
      </g>
      <rect x="392" y="253" width="42" height="12" rx="3" fill="#ffffff" fill-opacity="0.2"/>
      <rect x="424" y="255.5" width="3" height="7" rx="1" fill="#ffffff" fill-opacity="0.3"/>
    </g>

    <!-- orbit dots around the frame -->
    <circle cx="470" cy="40" r="4.5" fill="#6ee7a8">
      <animate attributeName="cy" values="40;24;40" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="250" r="4" fill="#3ec6ff">
      <animate attributeName="cy" values="250;268;250" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="302" r="3.4" fill="#ff6fd8">
      <animate attributeName="cy" values="302;312;302" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- footer strip -->
  <g transform="translate(74 372)">
    <text x="0" y="0" font-family="'Segoe UI', -apple-system, Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6788">Open source template · MIT licensed · fork it and put your own name on the lock screen</text>
    <rect x="0" y="16" width="420" height="2" rx="1" fill="url(#rainbow)" opacity="0.85">
      <animate attributeName="width" values="420;620;420" dur="6.8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
