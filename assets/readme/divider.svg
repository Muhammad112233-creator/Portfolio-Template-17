<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 10" width="1200" height="10" role="img" aria-label="divider">
  <defs>
    <linearGradient id="divg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5f6d" stop-opacity="1.0"/><stop offset="12%" stop-color="#ff9a44" stop-opacity="1.0"/><stop offset="24%" stop-color="#f7d038" stop-opacity="1.0"/><stop offset="36%" stop-color="#6ee7a8" stop-opacity="1.0"/><stop offset="50%" stop-color="#3ec6ff" stop-opacity="1.0"/><stop offset="64%" stop-color="#8b7cff" stop-opacity="1.0"/><stop offset="78%" stop-color="#ff6fd8" stop-opacity="1.0"/><stop offset="100%" stop-color="#ff5f6d" stop-opacity="1.0"/>
      <animate attributeName="gradientTransform" values="translate(-0.5 0);translate(0.5 0);translate(-0.5 0)" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="0" y="4" width="1200" height="2" rx="1" fill="url(#divg)"/>
  <circle r="4" cy="5" fill="url(#divg)">
    <animate attributeName="cx" values="60;1140;60" dur="9s" repeatCount="indefinite"/>
  </circle>
</svg>
